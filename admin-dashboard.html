<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewellery Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #292044;
    }
    header {
      background: #5425a8;
      color: white;
      padding: 20px;
    }
    header h2 { margin: 0 0 6px; }
    .layout { display: flex; min-height: 100vh; }
    nav {
      width: 200px;
      background: #fff;
      padding: 18px;
    }
    nav button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #eee7ff;
      color: #5425a8;
      text-align: left;
      font-weight: bold;
    }
    main { padding: 20px; flex: 1; min-width: 0; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px #24104a12;
    }
    .number { font-size: 26px; color: #5425a8; font-weight: bold; }
    .notice {
      margin-top: 18px;
      background: white;
      padding: 18px;
      border-radius: 12px;
    }
    @media(max-width:600px) {
      .layout { display: block; }
      nav { width: 100%; display: flex; flex-wrap: wrap; gap: 5px; }
      nav button { width: auto; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h2>Jewellery Admin</h2>
    <div>Advanced Dashboard</div>
  </header>
  <div class="layout">
    <nav>
      <button onclick="show('Dashboard')">Dashboard</button>
      <button onclick="show('Products')">Products</button>
      <button onclick="show('Orders')">Orders</button>
      <button onclick="show('Payments')">Payment Approval</button>
      <button onclick="show('Customers')">Customers</button>
      <button onclick="show('Reports')">Reports</button>
    </nav>
    <main>
      <h2 id="heading">Dashboard</h2>
      <div class="cards">
        <div class="card">Total Products<div class="number">—</div></div>
        <div class="card">Total Orders<div class="number">—</div></div>
        <div class="card">Pending Approval<div class="number">—</div></div>
        <div class="card">Customers<div class="number">—</div></div>
      </div>
      <div class="notice">
        <h3 id="section">Welcome!</h3>
        <p id="message">यह Admin Dashboard का शुरुआती डिज़ाइन है।</p>
        <p>ध्यान दें: असली डेटा और Payment Approval जोड़ने के लिए सुरक्षित backend integration अगला स्टेप है।</p>
      </div>
    </main>
  </div>
  <script>
    function show(section) {
      document.getElementById('heading').textContent = section;
      document.getElementById('section').textContent = section;
      document.getElementById('message').textContent =
        section + ' सेक्शन चुना गया है। Backend integration अगले स्टेप में होगा।';
    }
  </script>
</body>
</html>
