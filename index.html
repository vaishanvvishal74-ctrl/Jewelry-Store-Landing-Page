<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);

let products = [];
let cart = JSON.parse(localStorage.getItem("jewelleryCart") || "[]");
let wishlist = JSON.parse(localStorage.getItem("jewelleryWishlist") || "[]");

function money(value) {
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 2500);
}

function saveData() {
  localStorage.setItem("jewelleryCart", JSON.stringify(cart));
  localStorage.setItem("jewelleryWishlist", JSON.stringify(wishlist));
  updateCounts();
}

function updateCounts() {
  $("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.qty, 0);
  $("wishCount").textContent = wishlist.length;
}

function renderProducts() {
  const query = $("searchInput").value.trim().toLowerCase();
  const sort = $("sortSelect").value;
  const maxPrice = $("priceFilter").value;

  let list = products.filter(p => {
    const name = String(p.name || p.title || "").toLowerCase();
    const price = Number(p.price || 0);
    return name.includes(query) &&
      (maxPrice === "all" || price < Number(maxPrice));
  });

  if (sort === "low") list.sort((a,b) => a.price - b.price);
  if (sort === "high") list.sort((a,b) => b.price - a.price);
  if (sort === "name") {
    list.sort((a,b) =>
      String(a.name || a.title || "").localeCompare(
        String(b.name || b.title || "")
      )
    );
  }

  $("productStatus").textContent =
    list.length + " product(s) found";

  if (!list.length) {
    $("productGrid").innerHTML =
      '<div class="empty">No products found. Please check again.</div>';
    return;
  }

  $("productGrid").innerHTML = list.map(p => {
    const id = String(p.id);
    const name = p.name || p.title || "Jewellery";
    const image = p.image || p.image_url || "";
    const price = Number(p.price || 0);
    const liked = wishlist.includes(id);

    return `
      <article class="product">
        <div class="product-image">
          ${image
            ? `<img src="${escapeHTML(image)}"
                 alt="${escapeHTML(name)}"
                 onerror="this.style.display='none'">`
            : '<span class="placeholder"><i class="fa-solid fa-gem"></i></span>'}
          <button class="wish-btn ${liked ? "active" : ""}"
            onclick="toggleWish('${escapeJS(id)}')"
            aria-label="Add to wishlist">
            <i class="fa-${liked ? "solid" : "regular"} fa-heart"></i>
          </button>
        </div>
        <div class="product-info">
          <h3>${escapeHTML(name)}</h3>
          <div class="price">${money(price)}</div>
          <div class="product-actions">
            <button class="small-btn primary"
              onclick="addToCart('${escapeJS(id)}')">
              <i class="fa-solid fa-bag-shopping"></i> Add to Bag
            </button>
          </div>
        </div>
      </article>`;
  }).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function escapeJS(value) {
  return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

async function loadProducts() {
  try {
    const response = await fetch("/api/products");
    if (!response.ok) throw new Error("Products API unavailable");

    const data = await response.json();
    products = Array.isArray(data)
      ? data
      : (data.products || []);

    products = products.filter(p => p && p.id != null);
    renderProducts();
  } catch (error) {
    $("productGrid").innerHTML =
      '<div class="empty">Products could not be loaded. Please check the server API.</div>';
    $("productStatus").textContent =
      "Product API connection needs to be checked.";
  }
}

function addToCart(id) {
  const product = products.find(p => String(p.id) === String(id));
  if (!product) return;

  const existing = cart.find(item => String(item.id) === String(id));
  if (existing) {
    existing.qty++;
  } else {
    cart.push({
      id: product.id,
      name: product.name || product.title || "Jewellery",
      price: Number(product.price || 0),
      image: product.image || product.image_url || "",
      qty: 1
    });
  }

  saveData();
  renderCart();
  toast("Added to your shopping bag!");
}

function toggleWish(id) {
  id = String(id);
  wishlist = wishlist.includes(id)
    ? wishlist.filter(item => item !== id)
    : [...wishlist, id];

  saveData();
  renderProducts();
  toast(wishlist.includes(id)
    ? "Added to wishlist"
    : "Removed from wishlist");
}

function renderCart() {
  if (!cart.length) {
    $("cartItems").innerHTML =
      '<div class="empty">Your shopping bag is empty.</div>';
  } else {
    $("cartItems").innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${escapeHTML(item.image || "")}"
          alt="${escapeHTML(item.name)}"
          onerror="this.style.visibility='hidden'">
        <div>
          <h4>${escapeHTML(item.name)}</h4>
          <p>${money(item.price)}</p>
          <div class="qty">
            <button onclick="changeQty('${escapeJS(item.id)}',-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${escapeJS(item.id)}',1)">+</button>
          </div>
        </div>
        <button class="remove-btn"
          onclick="removeCartItem('${escapeJS(item.id)}')"
          aria-label="Remove item">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    `).join("");
  }

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.qty, 0
  );
  $("cartTotal").textContent = money(total);
  updateCounts();
}

function changeQty(id, amount) {
  const item = cart.find(p => String(p.id) === String(id));
  if (!item) return;

  item.qty += amount;
  if (item.qty <= 0) {
    cart = cart.filter(p => String(p.id) !== String(id));
  }

  saveData();
  renderCart();
}

function removeCartItem(id) {
  cart = cart.filter(p => String(p.id) !== String(id));
  saveData();
  renderCart();
}

function openCart() {
  $("cartDrawer").classList.add("open");
  $("overlay").classList.add("open");
  document.body.classList.add("no-scroll");
}

function closeCart() {
  $("cartDrawer").classList.remove("open");
  $("overlay").classList.remove("open");
  document.body.classList.remove("no-scroll");
}

function openCheckout() {
  if (!cart.length) {
    toast("Your shopping bag is empty.");
    return;
  }

  closeCart();
  $("checkoutModal").classList.add("open");
}

function closeCheckout() {
  $("checkoutModal").classList.remove("open");
}

$("cartNav").addEventListener("click", openCart);
$("closeCart").addEventListener("click", closeCart);
$("overlay").addEventListener("click", closeCart);
$("checkoutBtn").addEventListener("click", openCheckout);
$("closeCheckout").addEventListener("click", closeCheckout);

$("navToggle").addEventListener("click", () => {
  $("mainNav").classList.toggle("open");
});

$("mainNav").querySelectorAll("a").forEach(link => {
  link.addEventListener("click", () =>
    $("mainNav").classList.remove("open")
  );
});

$("searchInput").addEventListener("input", renderProducts);
$("sortSelect").addEventListener("change", renderProducts);
$("priceFilter").addEventListener("change", renderProducts);

$("wishlistNav").addEventListener("click", () => {
  const saved = products.filter(p => wishlist.includes(String(p.id)));
  if (!saved.length) {
    toast("Your wishlist is empty.");
    return;
  }

  $("searchInput").value = "";
  $("priceFilter").value = "all";
  $("productGrid").scrollIntoView({behavior:"smooth"});
  toast("Your wishlist has " + saved.length + " product(s).");
});

$("checkoutForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!cart.length) {
    toast("Your shopping bag is empty.");
    return;
  }

  const form = new FormData(event.target);
  const order = {
    name: form.get("name"),
    phone: form.get("phone"),
    email: form.get("email"),
    address: form.get("address"),
    city: form.get("city"),
    payment: form.get("payment"),
    items: cart.map(item => ({
      product_id: item.id,
      name: item.name,
      quantity: item.qty,
      price: item.price
    })),
    total: cart.reduce(
      (sum, item) => sum + item.price * item.qty, 0
    )
  };

  $("checkoutMessage").textContent =
    "Checking order connection...";

  try {
    const response = await fetch("/api/orders", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(order)
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || "Order could not be saved.");
    }

    $("checkoutMessage").textContent =
      "Order submitted successfully! Order ID: " +
      (result.orderId || result.id || "Received");

    cart = [];
    saveData();
    renderCart();
    event.target.reset();
    toast("Order submitted successfully!");
  } catch (error) {
    $("checkoutMessage").textContent =
      "Order submit nahi hua. Server ka /api/orders route aur request fields check karo.";
  }
});

async function loadSettings() {
  try {
    const response = await fetch("/api/settings");
    if (!response.ok) return;

    const data = await response.json();
    const s = data.settings || data;

    if (s.store_name) {
      $("storeName").textContent = s.store_name;
      $("footerStoreName").textContent = s.store_name;
    }
    if (s.hero_title) $("heroTitle").textContent = s.hero_title;
    if (s.hero_text) $("heroText").textContent = s.hero_text;
    if (s.about_title) $("aboutTitle").textContent = s.about_title;
    if (s.about_text) $("aboutText").textContent = s.about_text;
    if (s.address) $("storeAddress").textContent = s.address;
    if (s.city) $("storeCity").textContent = s.city;
    if (s.footer_text) $("footerText").textContent = s.footer_text;

    if (s.phone) {
      const phone = String(s.phone).replace(/[^\d+]/g, "");
      $("topPhone").href = "tel:" + phone;
      $("topPhoneText").textContent = s.phone;
      $("contactPhone").href = "tel:" + phone;
      $("contactPhone").textContent = s.phone;
      $("floatingPhone").href = "tel:" + phone;
    }

    if (s.email) {
      $("contactEmail").href = "mailto:" + s.email;
      $("contactEmail").textContent = s.email;
    }

    if (s.whatsapp) {
      const number = String(s.whatsapp).replace(/\D/g, "");
      const link = "https://wa.me/" + number;
      $("contactWhatsApp").href = link;
      $("floatingWhatsApp").href = link;
    }

    if (s.logo) {
      $("storeLogo").src = s.logo;
      $("storeLogo").style.display = "block";
    }
  } catch (error) {
    console.warn("Store settings could not be loaded.", error);
  }
}

updateCounts();
renderCart();
loadSettings();
loadProducts();
</script>
</body>
</html>
