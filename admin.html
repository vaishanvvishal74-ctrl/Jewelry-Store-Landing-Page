
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewellery Store - Admin Panel</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f9;
      color: #222;
    }
    header {
      background: #211a2b;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 21px; }
    main { max-width: 1100px; margin: 20px auto; padding: 12px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }
    h2 { margin-top: 0; font-size: 20px; }
    input, textarea, select, button {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font: inherit;
    }
    button {
      border: 0;
      cursor: pointer;
      background: #6c3f8c;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #555; }
    .danger { background: #bd3030; }
    .success { background: #227747; }
    .hidden { display: none !important; }
    .message { padding: 10px; border-radius: 7px; margin: 10px 0; }
    .error { background: #ffe8e8; color: #9d1515; }
    .ok { background: #e4f7e9; color: #145d2c; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .item {
      border: 1px solid #e2e2e2;
      border-radius: 9px;
      padding: 13px;
      overflow-wrap: anywhere;
    }
    .item img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      background: #f7f7f7;
      border-radius: 6px;
    }
    .item button { width: auto; margin-right: 5px; padding: 9px 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button { flex: 1; min-width: 110px; }
    .muted { color: #666; font-size: 14px; }
    .order-details { white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { overflow-wrap: anywhere; }
    @media (max-width: 500px) {
      header h1 { font-size: 18px; }
      .card { padding: 14px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Jewellery Store Admin</h1>
    <button id="logoutBtn" class="danger hidden"
      style="width:auto;margin:0">Logout</button>
  </header>

  <main>
    <div id="status" aria-live="polite"></div>

    <!-- LOGIN -->
    <section id="loginSection" class="card">
      <h2>Admin Login</h2>
      <p class="muted">Enter your administrator password.</p>

      <form id="loginForm">
        <label for="password">Admin Password</label>
        <input id="password" type="password"
          placeholder="Enter admin password"
          autocomplete="current-password" required>
        <button id="loginBtn" type="submit">Login</button>
      </form>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboard" class="hidden">
      <div class="card">
        <h2>Dashboard</h2>
        <div class="actions">
          <button id="loadProductsBtn">Refresh Products</button>
          <button id="loadOrdersBtn" class="secondary">Refresh Orders</button>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div class="card">
        <h2 id="productFormTitle">Add Product</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <label for="productName">Product Name</label>
          <input id="productName" maxlength="200"
            placeholder="Gold Necklace" required>

          <label for="productPrice">Price (₹)</label>
          <input id="productPrice" type="number"
            min="0" step="0.01" placeholder="2500" required>

          <label for="productImage">Image URL</label>
          <input id="productImage" type="url"
            placeholder="https://example.com/image.jpg">

          <div class="actions">
            <button id="saveProductBtn" type="submit">Save Product</button>
            <button id="cancelEditBtn" class="secondary hidden"
              type="button">Cancel Edit</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Products</h2>
        <div id="productsList" class="grid">
          <p>Products have not been loaded yet.</p>
        </div>
      </div>

      <!-- ORDERS -->
      <div class="card">
        <h2>Customer Orders</h2>
        <div id="ordersList">
          <p>Orders have not been loaded yet.</p>
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  "use strict";

  const API = "/api";
  let adminToken = "";
  let products = [];

  const $ = (id) => document.getElementById(id);

  function showMessage(message, isError = false) {
    const el = $("status");
    el.textContent = message;
    el.className = "message " + (isError ? "error" : "ok");
    el.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function clearMessage() {
    $("status").textContent = "";
    $("status").className = "hidden";
  }

  function setLoggedIn(value) {
    $("loginSection").classList.toggle("hidden", value);
    $("dashboard").classList.toggle("hidden", !value);
    $("logoutBtn").classList.toggle("hidden", !value);
  }

  async function apiRequest(path, options = {}) {
    const headers = { ...(options.headers || {}) };

    if (options.body && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }

    if (adminToken) {
      headers["Authorization"] = "Bearer " + adminToken;
    }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);

    try {
      const response = await fetch(API + path, {
        ...options,
        headers,
        signal: controller.signal
      });

      const raw = await response.text();
      let data = {};

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch {
          data = { message: raw };
        }
      }

      if (!response.ok) {
        throw new Error(
          data.error || data.message || ("Request failed: " + response.status)
        );
      }

      return data;
    } catch (error) {
      if (error.name === "AbortError") {
        throw new Error(
          "Request timed out. Check your Render server and database."
        );
      }
      throw error;
    } finally {
      clearTimeout(timeout);
    }
  }

  function getArray(data, key) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data[key])) return data[key];
    return [];
  }

  function formatPrice(value) {
    const amount = Number(value || 0);
    return "₹" + amount.toLocaleString("en-IN", {
      maximumFractionDigits: 2
    });
  }

  function makeText(tag, text, className) {
    const el = document.createElement(tag);
    el.textContent = text == null ? "" : String(text);
    if (className) el.className = className;
    return el;
  }

  // LOGIN
  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const password = $("password").value;
    const button = $("loginBtn");
    button.disabled = true;
    button.textContent = "Logging in...";

    try {
      const data = await apiRequest("/admin/login", {
        method: "POST",
        body: JSON.stringify({ password })
      });

      if (!data.token) {
        throw new Error(
          "Server did not return a login token. Check server.js."
        );
      }

      adminToken = data.token;
      $("password").value = "";
      setLoggedIn(true);
      showMessage("Login successful.");

      await Promise.allSettled([
        loadProducts(),
        loadOrders()
      ]);
    } catch (error) {
      showMessage("Login failed: " + error.message, true);
    } finally {
      button.disabled = false;
      button.textContent = "Login";
    }
  });

  // OPTIONAL SESSION CHECK
  async function checkExistingLogin() {
    try {
      const data = await apiRequest("/admin/check");
      if (data.authenticated === true || data.ok === true) {
        setLoggedIn(true);
        await Promise.allSettled([loadProducts(), loadOrders()]);
      }
    } catch {
      // Login manually if this server does not support session checking.
    }
  }

  // PRODUCTS: LOAD
  async function loadProducts() {
    $("productsList").replaceChildren(makeText("p", "Loading products..."));

    try {
      const data = await apiRequest("/products");
      products = getArray(data, "products");
      renderProducts();
    } catch (error) {
      $("productsList").replaceChildren(
        makeText("p", "Could not load products: " + error.message)
      );
    }
  }

  function renderProducts() {
    const container = $("productsList");
    container.replaceChildren();

    if (!products.length) {
      container.appendChild(makeText("p", "No products found."));
      return;
    }

    products.forEach((product) => {
      const card = document.createElement("article");
      card.className = "item";

      if (product.image) {
        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.name || "Product";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        card.appendChild(img);
      }

      card.appendChild(makeText("h3", product.name || "Unnamed product"));
      card.appendChild(makeText("p", formatPrice(product.price)));

      const editButton = makeText("button", "Edit");
      editButton.type = "button";
      editButton.addEventListener("click", () => editProduct(product));
      card.appendChild(editButton);

      const deleteButton = makeText("button", "Delete", "danger");
      deleteButton.type = "button";
      deleteButton.addEventListener("click", () => deleteProduct(product));
      card.appendChild(deleteButton);

      container.appendChild(card);
    });
  }

  // PRODUCTS: EDIT
  function editProduct(product) {
    $("productId").value = product.id ?? "";
    $("productName").value = product.name || "";
    $("productPrice").value = product.price ?? "";
    $("productImage").value = product.image || "";
    $("productFormTitle").textContent = "Edit Product";
    $("saveProductBtn").textContent = "Update Product";
    $("cancelEditBtn").classList.remove("hidden");
    $("productForm").scrollIntoView({ behavior: "smooth" });
  }

  function resetProductForm() {
    $("productForm").reset();
    $("productId").value = "";
    $("productFormTitle").textContent = "Add Product";
    $("saveProductBtn").textContent = "Save Product";
    $("cancelEditBtn").classList.add("hidden");
  }

  $("cancelEditBtn").addEventListener("click", resetProductForm);

  // PRODUCTS: CREATE / UPDATE
  $("productForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const id = $("productId").value;
    const name = $("productName").value.trim();
    const price = Number($("productPrice").value);
    const image = $("productImage").value.trim();

    if (!name) {
      showMessage("Please enter the product name.", true);
      return;
    }

    if (!Number.isFinite(price) || price < 0) {
      showMessage("Please enter a valid product price.", true);
      return;
    }

    const button = $("saveProductBtn");
    button.disabled = true;

    try {
      const payload = { name, price, image: image || null };
      const path = id ? "/products/" + encodeURIComponent(id) : "/products";
      const method = id ? "PUT" : "POST";

      await apiRequest(path, {
        method,
        body: JSON.stringify(payload)
      });

      showMessage(id ? "Product updated." : "Product added.");
      resetProductForm();
      await loadProducts();
    } catch (error) {
      showMessage("Could not save product: " + error.message, true);
    } finally {
      button.disabled = false;
    }
  });

  // PRODUCTS: DELETE
  async function deleteProduct(product) {
    if (!confirm('Delete "' + (product.name || "this product") + '"?')) {
      return;
    }

    try {
      await apiRequest(
        "/products/" + encodeURIComponent(product.id),
        { method: "DELETE" }
      );

      showMessage("Product deleted.");
      await loadProducts();
    } catch (error) {
      showMessage("Could not delete product: " + error.message, true);
    }
  }

  // ORDERS: LOAD
  async function loadOrders() {
    $("ordersList").replaceChildren(makeText("p", "Loading orders..."));

    try {
      const data = await apiRequest("/orders");
      const orders = getArray(data, "orders");
      renderOrders(orders);
    } catch (error) {
      $("ordersList").replaceChildren(
        makeText("p", "Could not load orders: " + error.message)
      );
    }
  }

  function renderOrders(orders) {
    const container = $("ordersList");
    container.replaceChildren();

    if (!orders.length) {
      container.appendChild(makeText("p", "No orders found."));
      return;
    }

    orders.forEach((order) => {
      const card = document.createElement("article");
      card.className = "item";
      card.style.marginBottom = "12px";

      card.appendChild(makeText("h3", "Order #" + order.id));

      card.appendChild(makeText("p",
        "Customer: " + (order.customer_name || "N/A")));
      card.appendChild(makeText("p",
        "Email: " + (order.customer_email || "N/A")));
      card.appendChild(makeText("p",
        "Phone: " + (order.phone || "N/A")));
      card.appendChild(makeText("p",
        "Address: " + (order.address || "N/A")));
      card.appendChild(makeText("p",
        "Total: " + formatPrice(order.total)));
      card.appendChild(makeText("p",
        "Payment method: " + (order.payment_method || "N/A")));
      card.appendChild(makeText("p",
        "Payment reference: " + (order.payment_reference || "N/A")));
      card.appendChild(makeText("p",
        "Feedback: " + (order.feedback || "N/A")));
      card.appendChild(makeText("p",
        "Created: " + (order.created_at || "N/A")));

      let items = order.items;
      if (typeof items === "string") {
        try { items = JSON.parse(items); } catch { /* keep as text */ }
      }

      const details = document.createElement("div");
      details.className = "order-details";
      details.textContent = "Items: " +
        (typeof items === "object" ? JSON.stringify(items, null, 2) :
          (items || "N/A"));
      card.appendChild(details);

      // Order status
      card.appendChild(makeText("label", "Order Status"));
      const orderStatus = document.createElement("select");

      ["pending", "approved", "processing", "shipped",
       "delivered", "rejected", "cancelled"].forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        orderStatus.appendChild(option);
      });

      orderStatus.value = order.status || "pending";
      card.appendChild(orderStatus);

      const orderButton = makeText("button", "Update Order Status");
      orderButton.type = "button";
      orderButton.addEventListener("click", async () => {
        await updateOrder(order.id, { status: orderStatus.value }, "status");
      });
      card.appendChild(orderButton);

      // Payment status
      card.appendChild(makeText("label", "Payment Status"));
      const paymentStatus = document.createElement("select");

      ["pending", "approved", "paid", "rejected", "failed", "refunded"]
        .forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          paymentStatus.appendChild(option);
        });

      paymentStatus.value = order.payment_status || "pending";
      card.appendChild(paymentStatus);

      const paymentButton = makeText("button", "Update Payment Status");
      paymentButton.type = "button";
      paymentButton.className = "success";
      paymentButton.addEventListener("click", async () => {
        await updateOrder(
          order.id,
          { payment_status: paymentStatus.value },
          "payment"
        );
      });
      card.appendChild(paymentButton);

      container.appendChild(card);
    });
  }

  async function updateOrder(id, payload, type) {
    try {
      const endpoint = type === "payment"
        ? "/orders/" + encodeURIComponent(id) + "/payment"
        : "/orders/" + encodeURIComponent(id) + "/status";

      await apiRequest(endpoint, {
        method: "PATCH",
        body: JSON.stringify(payload)
      });

      showMessage(type === "payment"
        ? "Payment status updated."
        : "Order status updated.");

      await loadOrders();
    } catch (error) {
      showMessage("Could not update order: " + error.message, true);
    }
  }

  $("loadProductsBtn").addEventListener("click", loadProducts);
  $("loadOrdersBtn").addEventListener("click", loadOrders);

  // LOGOUT
  $("logoutBtn").addEventListener("click", async () => {
    try {
      await apiRequest("/admin/logout", { method: "POST" });
    } catch {
      // Clear local login state even if the server has no logout endpoint.
    }

    adminToken = "";
    setLoggedIn(false);
    resetProductForm();
    $("productsList").replaceChildren();
    $("ordersList").replaceChildren();
    showMessage("Logged out.");
  });

  checkExistingLogin();
})();
</script>
</body>
  </html>
