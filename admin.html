
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishal Jewellers Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px Arial;background:#f6f3ef;color:#292522}
button,input,textarea,select{font:inherit;padding:10px;border:1px solid #ddd;border-radius:6px}
button{background:#8b5e3c;color:white;border:0;cursor:pointer;margin:3px}
input,textarea,select{width:100%;margin:5px 0}
label{display:block;font-weight:bold;margin-top:10px}
.hidden{display:none!important}
.login{max-width:380px;margin:10vh auto;padding:22px;background:white;border-radius:12px}
.layout{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
aside{background:#292522;color:white;padding:12px}
aside button{width:100%;text-align:left}
main{padding:16px;min-width:0}
.card,.stat{background:white;padding:15px;margin:12px 0;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat strong{font-size:24px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:450px;background:white}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.error{color:#b42318}
.success{color:#16803c}
@media(max-width:650px){
.layout{grid-template-columns:1fr}
aside button{width:auto}
.stats{grid-template-columns:1fr}
main{padding:8px}
}
</style>
</head>
<body>

<section id="loginScreen" class="login">
<h2>💎 Vishal Jewellers</h2>
<p>Admin Panel Login</p>
<form id="loginForm">
<label for="password">Admin Password</label>
<input id="password" type="password" required
autocomplete="current-password" placeholder="Enter admin password">
<button id="loginButton" type="submit">Login</button>
<p id="loginMessage" role="status"></p>
</form>
</section>

<section id="appScreen" class="layout hidden">
<aside>
<h3>💎 Vishal Jewellers</h3>
<button data-page="dashboard">Dashboard</button>
<button data-page="orders">Orders</button>
<button data-page="products">Products</button>
<button data-page="settings">Store Settings</button>
<button id="logoutButton" type="button">Logout</button>
</aside>
<main>
<h2 id="pageTitle">Dashboard</h2>
<p id="message" role="status"></p>

<section id="dashboardPage">
<div class="stats">
<div class="stat">Total Orders<br><strong id="totalOrders">0</strong></div>
<div class="stat">Products<br><strong id="totalProducts">0</strong></div>
<div class="stat">Pending Orders<br><strong id="pendingOrders">0</strong></div>
</div>
<div class="card">
<h3>Recent Orders</h3>
<div id="recentOrders" class="table-wrap">Loading...</div>
</div>
</section>

<section id="ordersPage" class="hidden">
<div class="card">
<h3>Orders</h3>
<button id="refreshOrders" type="button">Refresh Orders</button>
<div id="ordersTable" class="table-wrap"></div>
</div>
</section>

<section id="productsPage" class="hidden">
<div class="card">
<h3>Add / Edit Product</h3>
<form id="productForm">
<input id="productId" type="hidden">
<label>Product Name</label>
<input id="productName" required>
<label>Price (₹)</label>
<input id="productPrice" type="number" min="0" step="0.01" required>
<label>Image URL</label>
<input id="productImage" type="url" placeholder="https://...">
<button type="submit">Save Product</button>
<button id="clearProduct" type="button">Clear</button>
</form>
<p id="productMessage"></p>
</div>
<div class="card">
<h3>All Products</h3>
<div id="productsTable" class="table-wrap"></div>
</div>
</section>

<section id="settingsPage" class="hidden">
<div class="card">
<h3>Store Settings</h3>
<form id="settingsForm">
<label>Store Name</label><input id="storeName">
<label>Phone</label><input id="phone">
<label>WhatsApp</label><input id="whatsapp">
<label>Email</label><input id="email">
<label>Address</label><textarea id="address"></textarea>
<label>UPI ID</label><input id="upiId">
<label>QR Image URL</label><input id="qrUrl">
<button type="submit">Save Settings</button>
</form>
<p id="settingsMessage"></p>
</div>
</section>
</main>
</section>
<script>
  
const $ = id => document.getElementById(id);
let orders = [];
let products = [];
let settings = {};

function showMessage(id, text, error = false) {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = error ? "error" : "success";
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function money(value) {
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

// हर protected request में token भेजना जरूरी है।
async function api(url, options = {}) {
  const headers = { ...(options.headers || {}) };
  const token = sessionStorage.getItem("adminToken");

  if (token) headers.Authorization = "Bearer " + token;
  if (options.body) headers["Content-Type"] = "application/json";

  const response = await fetch(url, {...options, headers});
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.message || "Request failed: " + response.status);
  }
  return data;
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginButton").disabled = true;
  showMessage("loginMessage", "Logging in...");

  try {
    const data = await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({password: $("password").value})
    });

    if (!data.token) throw new Error("Server ne login token nahi diya.");

    sessionStorage.setItem("adminToken", data.token);
    $("password").value = "";
    $("loginScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");

    await loadDashboard();
    showMessage("message", "Login successful.");
  } catch (error) {
    showMessage("loginMessage", error.message, true);
  } finally {
    $("loginButton").disabled = false;
  }
});

$("logoutButton").addEventListener("click", () => {
  sessionStorage.removeItem("adminToken");
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  showMessage("loginMessage", "Logged out.");
});

function showPage(page) {
  ["dashboard","orders","products","settings"].forEach(name => {
    $(name + "Page").classList.toggle("hidden", name !== page);
  });
  $("pageTitle").textContent =
    page.charAt(0).toUpperCase() + page.slice(1);

  if (page === "settings") loadSettings();
  if (page === "orders") loadOrders();
  if (page === "products") loadProducts();
}

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

async function loadDashboard() {
  try {
    await Promise.all([loadOrders(), loadProducts()]);
    $("totalOrders").textContent = orders.length;
    $("totalProducts").textContent = products.length;
    $("pendingOrders").textContent = orders.filter(o =>
      String(o.status || "Pending").toLowerCase() === "pending"
    ).length;

    $("recentOrders").innerHTML = orders.length
      ? `<table><tr><th>ID</th><th>Customer</th><th>Total</th></tr>
        ${orders.slice(0,5).map(o => `<tr>
        <td>${safe(o.id)}</td><td>${safe(o.customer_name || "Customer")}</td>
        <td>${money(o.total)}</td></tr>`).join("")}</table>`
      : "<p>No orders found.</p>";
  } catch (error) {
    showMessage("message", error.message, true);
  }
}

async function loadOrders() {
  const data = await api("/api/orders");
  orders = Array.isArray(data) ? data : (data.orders || []);

  $("ordersTable").innerHTML = orders.length
    ? `<table><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th></tr>
      ${orders.map(o => `<tr>
      <td>${safe(o.id)}</td><td>${safe(o.customer_name)}</td>
      <td>${safe(o.phone)}</td><td>${money(o.total)}</td>
      <td>${safe(o.status || o.payment_status || "Pending")}</td>
      </tr>`).join("")}</table>`
    : "<p>No orders found.</p>";

  return orders;
}

$("refreshOrders").addEventListener("click", async () => {
  try {
    await loadOrders();
    showMessage("message", "Orders refreshed.");
  } catch (error) {
    showMessage("message", error.message, true);
  }
});
  
async function loadProducts() {
  const data = await api("/api/products");
  products = Array.isArray(data) ? data : (data.products || []);

  $("productsTable").innerHTML = products.length
    ? `<table><tr><th>Name</th><th>Price</th><th>Actions</th></tr>
      ${products.map(p => `<tr>
      <td>${safe(p.name)}</td><td>${money(p.price)}</td>
      <td><button type="button" data-edit="${safe(p.id)}">Edit</button>
      <button type="button" data-delete="${safe(p.id)}">Delete</button></td>
      </tr>`).join("")}</table>`
    : "<p>No products found.</p>";

  $("totalProducts").textContent = products.length;

  $("productsTable").querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => editProduct(button.dataset.edit));
  });
  $("productsTable").querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => deleteProduct(button.dataset.delete));
  });
}

function editProduct(id) {
  const p = products.find(item => String(item.id) === String(id));
  if (!p) return;
  $("productId").value = p.id;
  $("productName").value = p.name || "";
  $("productPrice").value = p.price || "";
  $("productImage").value = p.image || "";
  showPage("products");
}

$("clearProduct").addEventListener("click", () => {
  $("productForm").reset();
  $("productId").value = "";
  showMessage("productMessage", "");
});

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  const id = $("productId").value;
  const product = {
    name: $("productName").value.trim(),
    price: Number($("productPrice").value),
    image: $("productImage").value.trim()
  };

  try {
    await api(id ? "/api/products/" + encodeURIComponent(id) : "/api/products", {
      method: id ? "PUT" : "POST",
      body: JSON.stringify(product)
    });
    $("productForm").reset();
    $("productId").value = "";
    showMessage("productMessage", "Product saved.");
    await loadProducts();
  } catch (error) {
    showMessage("productMessage", error.message, true);
  }
});

async function deleteProduct(id) {
  if (!confirm("Product delete karna hai?")) return;
  try {
    await api("/api/products/" + encodeURIComponent(id), {method:"DELETE"});
    showMessage("message", "Product deleted.");
    await loadProducts();
  } catch (error) {
    showMessage("message", error.message, true);
  }
}

async function loadSettings() {
  try {
    const data = await api("/api/settings");
    settings = data.settings || {};
    $("storeName").value = settings.store_name || "Vishal Jewellers";
    $("phone").value = settings.phone || "";
    $("whatsapp").value = settings.whatsapp || "";
    $("email").value = settings.email || "";
    $("address").value = settings.address || "";
    $("upiId").value = settings.upi_id || "";
    $("qrUrl").value = settings.qr_url || "";
  } catch (error) {
    showMessage("settingsMessage", error.message, true);
  }
}

$("settingsForm").addEventListener("submit", async event => {
  event.preventDefault();
  const newSettings = {
    store_name: $("storeName").value.trim(),
    phone: $("phone").value.trim(),
    whatsapp: $("whatsapp").value.trim(),
    email: $("email").value.trim(),
    address: $("address").value.trim(),
    upi_id: $("upiId").value.trim(),
    qr_url: $("qrUrl").value.trim()
  };

  try {
    await api("/api/settings", {
      method: "PUT",
      body: JSON.stringify({settings: newSettings})
    });
    showMessage("settingsMessage", "Settings saved.");
  } catch (error) {
    showMessage("settingsMessage", error.message, true);
  }
});

// Page refresh par purana token validate karo.
async function restoreSession() {
  const token = sessionStorage.getItem("adminToken");
  if (!token) return;

  try {
    await api("/api/admin/me");
    $("loginScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    await loadDashboard();
  } catch {
    sessionStorage.removeItem("adminToken");
  }
}

restoreSession();
</script>
</body>
</html>
